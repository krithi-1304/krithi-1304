name: Update contribution console

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate contribution console
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/generate-contributions.mjs
      - name: Commit updated console
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/contributions.svg
          git diff --cached --quiet || git commit -m "Update contribution console"
          git push
