<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 320" role="img" aria-labelledby="title desc">
  <title id="title">Krithi's project signal map</title>
  <desc id="desc">A dark project board showing FOGLASS, GLOWMORY, The Black Wall, and Portfolio as connected signals.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b0a13"/><stop offset="1" stop-color="#171328"/></linearGradient><style>.pulse{animation:pulse 2.4s ease-in-out infinite}.dash{animation:dash 13s linear infinite}@keyframes pulse{50%{opacity:.3;transform:scale(1.45)}}@keyframes dash{to{stroke-dashoffset:-100}}</style></defs>
  <rect width="1400" height="320" rx="24" fill="url(#bg)" stroke="#ffffff" stroke-opacity=".14"/><text x="42" y="48" fill="#94a3b8" font-family="ui-monospace,monospace" font-size="14" letter-spacing="3">KRITHI / PROJECT SIGNAL MAP</text><text x="1350" y="48" text-anchor="end" fill="#fbbf24" font-family="ui-monospace,monospace" font-size="14">04 WORLDS</text>
  <path class="dash" d="M175 164H1225" stroke="#fbbf24" stroke-opacity=".22" stroke-dasharray="3 12" fill="none"/>
  <g font-family="ui-monospace,monospace">
    <g transform="translate(68 88)"><rect width="270" height="158" rx="16" fill="#f59e0b" fill-opacity=".08" stroke="#fbbf24" stroke-opacity=".55"/><text x="22" y="40" fill="#fbbf24" font-size="16">01 / FOGLASS</text><text x="22" y="76" fill="#f8fafc" font-family="ui-sans-serif,system-ui,sans-serif" font-size="23" font-weight="700">sensory interface</text><text x="22" y="112" fill="#94a3b8" font-size="13">camera · breath · webgl</text><circle class="pulse" cx="238" cy="30" r="5" fill="#fbbf24"/></g>
    <g transform="translate(380 88)"><rect width="270" height="158" rx="16" fill="#fb7185" fill-opacity=".08" stroke="#fb7185" stroke-opacity=".5"/><text x="22" y="40" fill="#fb7185" font-size="16">02 / GLOWMORY</text><text x="22" y="76" fill="#f8fafc" font-family="ui-sans-serif,system-ui,sans-serif" font-size="23" font-weight="700">memory as light</text><text x="22" y="112" fill="#94a3b8" font-size="13">local-first · gentle · private</text><circle class="pulse" cx="238" cy="30" r="5" fill="#fb7185"/></g>
    <g transform="translate(692 88)"><rect width="270" height="158" rx="16" fill="#a78bfa" fill-opacity=".09" stroke="#a78bfa" stroke-opacity=".52"/><text x="22" y="40" fill="#c4b5fd" font-size="16">03 / BLACK WALL</text><text x="22" y="76" fill="#f8fafc" font-family="ui-sans-serif,system-ui,sans-serif" font-size="23" font-weight="700">encrypted rooms</text><text x="22" y="112" fill="#94a3b8" font-size="13">diary · archive · sharing</text><circle class="pulse" cx="238" cy="30" r="5" fill="#c4b5fd"/></g>
    <g transform="translate(1004 88)"><rect width="270" height="158" rx="16" fill="#67e8f9" fill-opacity=".07" stroke="#67e8f9" stroke-opacity=".48"/><text x="22" y="40" fill="#67e8f9" font-size="16">04 / PORTFOLIO</text><text x="22" y="76" fill="#f8fafc" font-family="ui-sans-serif,system-ui,sans-serif" font-size="23" font-weight="700">the open notebook</text><text x="22" y="112" fill="#94a3b8" font-size="13">experiments · ideas · work</text><circle class="pulse" cx="238" cy="30" r="5" fill="#67e8f9"/></g>
  </g>
</svg>
