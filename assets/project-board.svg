<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 380" role="img" aria-labelledby="title desc">
  <title id="title">Krithi's featured projects</title><desc id="desc">A layered cyber-femme workbench with featured projects FOGLASS, Glowmory, The Black Wall and Portfolio.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a0610"/><stop offset="1" stop-color="#1d0b29"/></linearGradient><linearGradient id="pink" x1="0" x2="1"><stop stop-color="#ec4899"/><stop offset="1" stop-color="#f9a8d4"/></linearGradient><style>.float{animation:float 5s ease-in-out infinite alternate}.blink{animation:blink 2s steps(2,end) infinite}@keyframes float{to{transform:translateY(-6px)}}@keyframes blink{50%{opacity:.15}}</style></defs>
  <rect width="1400" height="380" rx="24" fill="url(#bg)" stroke="#f9a8d4" stroke-opacity=".55"/><text x="40" y="43" fill="#f9a8d4" font-family="ui-monospace,monospace" font-size="13" letter-spacing="3">WORKBENCH / SELECTED BUILDS</text><text x="1360" y="43" text-anchor="end" fill="#67e8f9" font-family="ui-monospace,monospace" font-size="13">CLICK A PROJECT ABOVE</text>
  <g class="float" font-family="ui-monospace,monospace">
    <g transform="translate(40 82)"><rect width="408" height="244" rx="18" fill="#ec4899" fill-opacity=".1" stroke="#f9a8d4" stroke-width="2"/><text x="28" y="40" fill="#67e8f9" font-size="14">01 / SENSORIAL SYSTEM</text><text x="28" y="92" fill="#fff" font-family="ui-sans-serif,system-ui,sans-serif" font-size="34" font-weight="800">FOGLASS</text><path d="M28 114h350" stroke="#f472b6" stroke-opacity=".5"/><text x="28" y="150" fill="#fbcfe8" font-size="14">draw on fogged glass</text><text x="28" y="178" fill="#fbcfe8" font-size="14">breath becomes input</text><text x="28" y="216" fill="#67e8f9" font-size="13">CAMERA / MIC / WEBGL</text><circle class="blink" cx="366" cy="28" r="6" fill="#67e8f9"/></g>
    <g transform="translate(476 112)"><rect width="408" height="214" rx="18" fill="#a78bfa" fill-opacity=".12" stroke="#c4b5fd" stroke-width="2"/><text x="28" y="40" fill="#f9a8d4" font-size="14">02 / MEMORY SYSTEM</text><text x="28" y="92" fill="#fff" font-family="ui-sans-serif,system-ui,sans-serif" font-size="34" font-weight="800">GLOWMORY</text><path d="M28 114h350" stroke="#c4b5fd" stroke-opacity=".5"/><text x="28" y="150" fill="#ddd6fe" font-size="14">good days become fireflies</text><text x="28" y="188" fill="#67e8f9" font-size="13">LOCAL-FIRST / GENTLE UI</text><circle class="blink" cx="366" cy="28" r="6" fill="#f9a8d4"/></g>
    <g transform="translate(912 82)"><rect width="448" height="244" rx="18" fill="#22d3ee" fill-opacity=".08" stroke="#67e8f9" stroke-width="2"/><text x="28" y="40" fill="#f9a8d4" font-size="14">03 / PRIVATE ARCHIVE</text><text x="28" y="92" fill="#fff" font-family="ui-sans-serif,system-ui,sans-serif" font-size="34" font-weight="800">THE BLACK WALL</text><path d="M28 114h390" stroke="#67e8f9" stroke-opacity=".5"/><text x="28" y="150" fill="#cffafe" font-size="14">rooms for handwritten thoughts</text><text x="28" y="178" fill="#cffafe" font-size="14">encrypted in your browser</text><text x="28" y="216" fill="#f9a8d4" font-size="13">PASSPHRASE / SHARING / OFFLINE</text><circle class="blink" cx="406" cy="28" r="6" fill="#f9a8d4"/></g>
  </g>
</svg>
