<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 340" role="img" aria-labelledby="title desc">
  <title id="title">Krithi's cyber-femme project dashboard</title>
  <desc id="desc">A pink, lavender, cyan and black project dashboard showing FOGLASS, GLOWMORY, BLACK WALL and PORTFOLIO.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#100817"/><stop offset="1" stop-color="#24102b"/></linearGradient><linearGradient id="chrome" x1="0" x2="1"><stop stop-color="#f472b6"/><stop offset=".5" stop-color="#f5d0fe"/><stop offset="1" stop-color="#67e8f9"/></linearGradient><style>.blink{animation:blink 1.7s steps(2,end) infinite}@keyframes blink{50%{opacity:.22}}</style></defs>
  <rect width="1400" height="340" rx="24" fill="url(#bg)" stroke="url(#chrome)" stroke-opacity=".55"/>
  <text x="40" y="48" fill="#f9a8d4" font-family="ui-monospace,monospace" font-size="14" letter-spacing="3">/ PROJECTS / LIVE WORKBENCH</text><text x="1360" y="48" text-anchor="end" fill="#67e8f9" font-family="ui-monospace,monospace" font-size="14">04 REPOS ✦ 0 BORING</text>
  <g font-family="ui-monospace,monospace">
    <g transform="translate(42 82)"><rect width="310" height="188" rx="14" fill="#ec4899" fill-opacity=".12" stroke="#f9a8d4" stroke-opacity=".8"/><text x="22" y="38" fill="#f9a8d4" font-size="15">01 // FOGLASS</text><text x="22" y="82" fill="#fff" font-family="ui-sans-serif,system-ui,sans-serif" font-size="27" font-weight="750">sensory UI</text><text x="22" y="120" fill="#fbcfe8" font-size="13">camera · breath · WebGL</text><text x="22" y="158" fill="#67e8f9" font-size="13">[ LIVE ]</text><circle class="blink" cx="280" cy="28" r="6" fill="#67e8f9"/></g>
    <g transform="translate(372 82)"><rect width="310" height="188" rx="14" fill="#a78bfa" fill-opacity=".13" stroke="#c4b5fd" stroke-opacity=".8"/><text x="22" y="38" fill="#ddd6fe" font-size="15">02 // GLOWMORY</text><text x="22" y="82" fill="#fff" font-family="ui-sans-serif,system-ui,sans-serif" font-size="27" font-weight="750">memory ✦ light</text><text x="22" y="120" fill="#ddd6fe" font-size="13">local-first · gentle · private</text><text x="22" y="158" fill="#f9a8d4" font-size="13">[ GLOWING ]</text><circle class="blink" cx="280" cy="28" r="6" fill="#f9a8d4"/></g>
    <g transform="translate(702 82)"><rect width="310" height="188" rx="14" fill="#22d3ee" fill-opacity=".09" stroke="#67e8f9" stroke-opacity=".8"/><text x="22" y="38" fill="#67e8f9" font-size="15">03 // BLACK WALL</text><text x="22" y="82" fill="#fff" font-family="ui-sans-serif,system-ui,sans-serif" font-size="27" font-weight="750">encrypted rooms</text><text x="22" y="120" fill="#cffafe" font-size="13">diary · archive · sharing</text><text x="22" y="158" fill="#f9a8d4" font-size="13">[ LOCKED ]</text><circle class="blink" cx="280" cy="28" r="6" fill="#f9a8d4"/></g>
    <g transform="translate(1032 82)"><rect width="310" height="188" rx="14" fill="#f9a8d4" fill-opacity=".1" stroke="#f472b6" stroke-opacity=".8"/><text x="22" y="38" fill="#f9a8d4" font-size="15">04 // PORTFOLIO</text><text x="22" y="82" fill="#fff" font-family="ui-sans-serif,system-ui,sans-serif" font-size="27" font-weight="750">open notebook</text><text x="22" y="120" fill="#fbcfe8" font-size="13">experiments · ideas · work</text><text x="22" y="158" fill="#67e8f9" font-size="13">[ EDITING ]</text><circle class="blink" cx="280" cy="28" r="6" fill="#67e8f9"/></g>
