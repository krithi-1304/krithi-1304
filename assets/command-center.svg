<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 250" role="img" aria-labelledby="title desc">
  <title id="title">Krithi's command center</title><desc id="desc">A cyber-femme status console with a current build, technology stack, and system status.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c0712"/><stop offset="1" stop-color="#24102f"/></linearGradient><linearGradient id="edge" x1="0" x2="1"><stop stop-color="#f472b6"/><stop offset=".5" stop-color="#c4b5fd"/><stop offset="1" stop-color="#67e8f9"/></linearGradient><style>.ping{animation:ping 1.8s ease-in-out infinite}.bar{animation:bar 2.8s ease-out infinite alternate}@keyframes ping{50%{opacity:.25}}@keyframes bar{to{stroke-dashoffset:-100}}</style></defs>
  <rect width="1400" height="250" rx="24" fill="url(#bg)" stroke="url(#edge)" stroke-opacity=".6"/>
  <g font-family="ui-monospace,monospace"><text x="38" y="38" fill="#f9a8d4" font-size="13" letter-spacing="3">COMMAND CENTER / 2026</text><text x="1360" y="38" text-anchor="end" fill="#67e8f9" font-size="13">SYSTEMS ONLINE</text>
  <g transform="translate(38 68)"><text fill="#67e8f9" font-size="12">NOW BUILDING</text><text y="43" fill="#fff" font-family="ui-sans-serif,system-ui,sans-serif" font-size="32" font-weight="750">FOGLASS</text><text y="72" fill="#ddd6fe" font-size="13">a fog mirror for breath + hands</text><text y="108" fill="#f9a8d4" font-size="12">[ LIVE DEMO ↗ ]</text></g>
  <g transform="translate(505 68)"><text fill="#67e8f9" font-size="12">STACK SIGNAL</text><text y="43" fill="#fff" font-size="16">TypeScript　React　WebGL</text><text y="72" fill="#f9a8d4" font-size="16">Node.js　Python　Playwright</text><text y="108" fill="#94a3b8" font-size="12">browser-native / privacy-minded / expressive UI</text></g>
  <g transform="translate(1025 68)"><text fill="#67e8f9" font-size="12">BUILD STATUS</text><circle class="ping" cx="8" cy="42" r="6" fill="#f472b6"/><text x="24" y="48" fill="#fff" font-size="16">compiling cute ideas</text><path class="bar" d="M0 82H300" stroke="#f9a8d4" stroke-width="7" stroke-dasharray="55 16"/><text y="116" fill="#94a3b8" font-size="12">LOCAL-FIRST // 88%</text></g></g>
</svg>
