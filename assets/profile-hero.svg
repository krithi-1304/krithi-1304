    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f472b6"/><stop offset=".22" stop-color="#fff1fb"/><stop offset=".45" stop-color="#c4b5fd"/><stop offset=".67" stop-color="#fff"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
