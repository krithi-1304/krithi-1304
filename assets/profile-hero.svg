    <style>.float{animation:float 6s ease-in-out infinite alternate}.scan{animation:scan 4s linear infinite}.blink{animation:blink 1.1s steps(2,end) infinite}.orbit{transform-origin:1110px 252px;animation:spin 18s linear infinite}@keyframes float{to{transform:translateY(-9px)}}@keyframes scan{to{transform:translateY(36px)}}@keyframes blink{50%{opacity:0}}@keyframes spin{to{transform:rotate(360deg)}}</style>
