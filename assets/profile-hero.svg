<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc">
  <title id="title">KRITHI — soft girl, hard tech</title>
  <desc id="desc">A cyber-femme terminal hero with hot pink, lavender and cyan lights, a heart-shaped cursor, chrome details and a developer tagline.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b0714"/><stop offset=".5" stop-color="#190c2c"/><stop offset="1" stop-color="#270b25"/></linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f9a8d4"/><stop offset=".25" stop-color="#fff"/><stop offset=".5" stop-color="#c4b5fd"/><stop offset=".75" stop-color="#fff"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
    <radialGradient id="pink"><stop stop-color="#ec4899" stop-opacity=".55"/><stop offset="1" stop-color="#ec4899" stop-opacity="0"/></radialGradient>
    <radialGradient id="blue"><stop stop-color="#22d3ee" stop-opacity=".35"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="34"/></filter><filter id="glow"><feGaussianBlur stdDeviation="4"/></filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#f9a8d4" stroke-opacity=".08"/></pattern>
    <style>.scan{animation:scan 5s linear infinite}.pulse{animation:pulse 2s ease-in-out infinite}.blink{animation:blink 1s steps(2,end) infinite}@keyframes scan{to{transform:translateY(32px)}}@keyframes pulse{50%{opacity:.38;transform:scale(1.2)}}@keyframes blink{50%{opacity:0}}</style>
  </defs>
  <rect width="1400" height="520" rx="28" fill="url(#bg)"/>
  <circle cx="1120" cy="90" r="300" fill="url(#pink)" filter="url(#blur)"/><circle cx="180" cy="460" r="270" fill="url(#blue)" filter="url(#blur)"/>
  <rect width="1400" height="520" rx="28" fill="url(#grid)"/>
  <g opacity=".35" class="scan"><path d="M0 70H1400" stroke="#f472b6" stroke-opacity=".4"/><path d="M0 71H1400" stroke="#fff" stroke-opacity=".13"/></g>
  <rect x="64" y="58" width="1272" height="400" rx="20" fill="#08050f" fill-opacity=".4" stroke="url(#chrome)" stroke-opacity=".55"/>
  <g fill="#f472b6"><circle cx="96" cy="91" r="6"/><circle cx="116" cy="91" r="6" fill="#c4b5fd"/><circle cx="136" cy="91" r="6" fill="#67e8f9"/></g>
  <text x="170" y="97" fill="#f9a8d4" font-family="ui-monospace,monospace" font-size="14" letter-spacing="3">krithi@github:~ / profile.exe</text>
  <g transform="translate(124 164)"><text x="0" y="0" fill="#67e8f9" font-family="ui-monospace,monospace" font-size="18">&gt; whoami</text><text x="0" y="84" fill="#fff" font-family="ui-sans-serif,system-ui,sans-serif" font-size="88" font-weight="850" letter-spacing="-5">KRITHI</text><text x="5" y="130" fill="#f9a8d4" font-family="ui-monospace,monospace" font-size="24" letter-spacing="3">SOFT GIRL / HARD TECH</text><text x="5" y="181" fill="#c4b5fd" font-family="ui-sans-serif,system-ui,sans-serif" font-size="21">building dreamy interfaces with serious engineering underneath</text><text x="5" y="238" fill="#67e8f9" font-family="ui-monospace,monospace" font-size="16">[ local-first ] [ privacy-minded ] [ currently shipping ]<tspan class="blink">_</tspan></text></g>
  <g transform="translate(1040 166)"><circle class="pulse" cx="88" cy="88" r="88" fill="none" stroke="#f472b6" stroke-opacity=".35" stroke-width="2"/><path d="M88 132C40 104 18 81 18 52c0-22 28-34 45-10 17-24 45-12 45 10 0 29-22 52-70 80Z" fill="#ec4899" fill-opacity=".16" stroke="#f9a8d4" stroke-width="2"/><path d="M52 65l12 12 26-29" fill="none" stroke="#67e8f9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text x="124" y="420" fill="#f9a8d4" font-family="ui-monospace,monospace" font-size="14">SYSTEM STATUS: ONLINE</text><text x="1080" y="420" fill="#c4b5fd" font-family="ui-monospace,monospace" font-size="14">2026 // BUILD 001</text>
  <g class="pulse" fill="#67e8f9"><circle cx="1160" cy="128" r="3"/><circle cx="1220" cy="380" r="3"/><circle cx="960" cy="380" r="2"/></g>
</svg>
