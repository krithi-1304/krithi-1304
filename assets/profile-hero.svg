<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc">
  <title id="title">KRITHI — local-first digital worlds</title>
  <desc id="desc">A cinematic violet and amber interface with orbiting signal lines and the words KRITHI, local-first digital worlds.</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#090716"/><stop offset=".46" stop-color="#16102f"/><stop offset="1" stop-color="#32132b"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f59e0b" stop-opacity="0"/><stop offset=".5" stop-color="#fbbf24"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></linearGradient>
    <radialGradient id="amber"><stop stop-color="#f59e0b" stop-opacity=".48"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient>
    <radialGradient id="violet"><stop stop-color="#a78bfa" stop-opacity=".42"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="35"/></filter><filter id="soft"><feGaussianBlur stdDeviation="7"/></filter>
    <pattern id="grain" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".5" fill="#fff" opacity=".08"/></pattern>
    <style>.orbit{transform-origin:700px 260px;animation:spin 22s linear infinite}.orbit2{transform-origin:700px 260px;animation:spin 31s linear infinite reverse}.blink{animation:blink 2.7s steps(2,end) infinite}.float{animation:float 7s ease-in-out infinite alternate}@keyframes spin{to{transform:rotate(360deg)}}@keyframes blink{50%{opacity:.18}}@keyframes float{to{transform:translateY(-15px)}}</style>
  </defs>
  <rect width="1400" height="520" rx="28" fill="url(#night)"/>
  <circle cx="1060" cy="90" r="280" fill="url(#amber)" filter="url(#blur)"/><circle cx="250" cy="470" r="300" fill="url(#violet)" filter="url(#blur)"/>
  <rect width="1400" height="520" rx="28" fill="url(#grain)" opacity=".48"/>
  <g fill="none" stroke="#c4b5fd" stroke-opacity=".18"><ellipse cx="700" cy="260" rx="560" ry="150" transform="rotate(-18 700 260)"/><ellipse cx="700" cy="260" rx="430" ry="100" transform="rotate(28 700 260)"/><ellipse cx="700" cy="260" rx="280" ry="72" transform="rotate(-42 700 260)"/></g>
  <g class="orbit" fill="none" stroke="#fbbf24" stroke-opacity=".34" stroke-dasharray="3 15"><ellipse cx="700" cy="260" rx="560" ry="150" transform="rotate(-18 700 260)"/></g>
  <g class="orbit2" fill="none" stroke="#67e8f9" stroke-opacity=".24" stroke-dasharray="1 19"><ellipse cx="700" cy="260" rx="430" ry="100" transform="rotate(28 700 260)"/></g>
  <circle cx="700" cy="260" r="78" fill="#0b081b" stroke="#fbbf24" stroke-opacity=".52"/><circle class="blink" cx="700" cy="260" r="55" fill="none" stroke="#fbbf24" stroke-width="1" stroke-opacity=".65"/><circle cx="700" cy="260" r="6" fill="#fbbf24" filter="url(#soft)"/><circle cx="700" cy="260" r="3" fill="#fff7ed"/>
  <g class="float"><text x="108" y="130" fill="#f8fafc" font-family="ui-sans-serif,system-ui,sans-serif" font-size="88" font-weight="800" letter-spacing="-4">KRITHI</text><text x="116" y="178" fill="#fbbf24" font-family="ui-monospace,monospace" font-size="20" letter-spacing="4">LOCAL-FIRST DIGITAL WORLDS</text><path d="M116 205h322" stroke="url(#line)"/><text x="116" y="250" fill="#cbd5e1" font-family="ui-sans-serif,system-ui,sans-serif" font-size="19">interfaces / privacy / atmosphere</text></g>
  <g font-family="ui-monospace,monospace" font-size="14" fill="#94a3b8"><text x="109" y="418">SIGNAL 001</text><text x="1100" y="418">BUILDING QUIET SOFTWARE</text><text x="109" y="445" fill="#fbbf24">● ONLINE</text><text x="1100" y="445">2026 / 11 / 18</text></g>
  <g fill="#67e8f9"><circle cx="194" cy="344" r="2"/><circle cx="1202" cy="178" r="2"/><circle cx="1010" cy="382" r="2"/></g>
</svg>
