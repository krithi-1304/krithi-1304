<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 540" role="img" aria-labelledby="title desc">
  <title id="title">Krithi — cyber-femme developer</title><desc id="desc">A Y2K cyber-femme interface with pearl chrome, hot pink, lavender and cyan details.</desc>
  <defs>
